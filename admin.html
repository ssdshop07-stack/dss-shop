<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>DSS SHOP | Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #172033;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
    }

    .card {
      background: #fff;
      padding: 24px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    input, textarea, select {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }

    input[type="checkbox"] {
      display: inline-block;
      width: auto;
      margin-right: 8px;
    }

    button {
      padding: 12px 16px;
      margin: 4px 4px 4px 0;
      border: 0;
      border-radius: 8px;
      background: #155eef;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      background: #475467;
    }

    .danger {
      background: #b42318;
    }

    .message {
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    [hidden] {
      display: none !important;
    }

    img {
      max-width: 100%;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="card">
      <h1>DSS SHOP</h1>
      <p>Paneli i administrimit</p>
      <button type="button" id="logout" class="danger" hidden>
        Dil nga llogaria
      </button>
    </header>

    <!-- HYRJA -->
    <section id="login" class="card">
      <h2>Hyr në Admin</h2>

      <form id="loginForm" onsubmit="return false;">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          autocomplete="username"
          placeholder="Email-i yt"
          required
        >

        <label for="password">Fjalëkalimi</label>
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          placeholder="Fjalëkalimi"
          required
        >

        <button type="submit">Hyr</button>
        <button type="button" id="forgotBtn" class="secondary">
          Harrova fjalëkalimin
        </button>
      </form>

      <p id="loginMsg" class="message" role="status"></p>
    </section>

    <!-- RIVENDOSJA E FJALËKALIMIT -->
    <section id="reset" class="card" hidden>
      <h2>Ndrysho fjalëkalimin</h2>

      <form id="resetForm">
        <label for="newPassword">Fjalëkalimi i ri</label>
        <input
          type="password"
          id="newPassword"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <label for="newPassword2">Përsërite fjalëkalimin</label>
        <input
          type="password"
          id="newPassword2"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button type="submit">Ruaj fjalëkalimin</button>
      </form>

      <p id="resetMsg" class="message" role="status"></p>
    </section>

    <!-- PANELI ADMIN -->
    <section id="panel" hidden>

      <section class="card">
        <h2>Produktet</h2>
        <button type="button" id="newBtn">+ Shto produkt</button>
        <div id="productsAdmin">
          <p>Produktet do të shfaqen këtu.</p>
        </div>
      </section>

      <!-- FORMA E PRODUKTIT -->
      <section id="productFormBox" class="card" hidden>
        <h2 id="formTitle">Shto produkt</h2>

        <form id="productForm">
          <input type="hidden" id="productId">

          <label for="productName">Emri i produktit</label>
          <input id="productName" type="text" required>

          <label for="productSku">Kodi SKU</label>
          <input id="productSku" type="text">

          <label for="productCategory">Kategoria</label>
          <input id="productCategory" type="text" required>

          <label for="productPrice">Çmimi (€)</label>
          <input
            id="productPrice"
            type="number"
            min="0"
            step="0.01"
            required
          >

          <label for="productSalePrice">Çmimi promocional (€)</label>
          <input
            id="productSalePrice"
            type="number"
            min="0"
            step="0.01"
          >

          <label for="productStock">Stoku</label>
          <input
            id="productStock"
            type="number"
            min="0"
            step="1"
            value="0"
            required
          >

          <label for="productDescription">Përshkrimi</label>
          <textarea id="productDescription" rows="4"></textarea>

          <label>
            <input type="checkbox" id="productFeatured">
            Produkt i veçuar
          </label>

          <label>
            <input type="checkbox" id="productActive" checked>
            Produkt aktiv
          </label>

          <label for="productImage">Fotoja e produktit</label>
          <input
            id="productImage"
            type="file"
            accept="image/*"
          >

          <div id="imagePreview"></div>

          <p id="productMsg" class="message" role="status"></p>

          <button type="submit">Ruaj produktin</button>
          <button type="button" id="cancelProduct" class="secondary">
            Anulo
          </button>
        </form>
      </section>

      <!-- POROSITË -->
      <section class="card">
        <h2>Porositë</h2>
        <div id="orders">
          <p>Porositë do të shfaqen këtu.</p>
        </div>
      </section>

    </section>
  </main>

  <!-- NGARKIMI I SKRIPTEVE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js?v=1"></script>
  <script src="./admin.js?v=11"></script>

</body>
</html>
