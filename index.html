    /* DSS mobile cart page, inspired by the supplied reference */
    #cart.drawer{width:100%;max-width:100%;height:100dvh;top:0;right:0;z-index:1005;border:0;border-left:0;background:#090909;padding:0 0 calc(82px + env(safe-area-inset-bottom));box-shadow:none}
    #cart.drawer.open{transform:translateX(0);visibility:visible}
    #cart .drawerHead{position:sticky;top:0;z-index:3;min-height:72px;padding:10px 20px;background:#090909;border-bottom:1px solid #292929;margin:0}

    #cart .drawerHead button{background:transparent;border:1px solid #444;border-radius:50%;width:40px;height:40px}

    #cartItems{padding:0 20px}

    .dss-qty button{height:40px;min-width:42px;padding:0;background:transparent;color:white;border:0;font-size:21px}
    .dss-qty span{height:40px;min-width:48px;display:flex;align-items:center;justify-content:center;border-left:1px solid #414141;border-right:1px solid #414141}

    .dss-line-total{grid-column:2 / 4;grid-row:2;text-align:right;font-size:18px;align-self:center}
    .dss-cart-summary{margin:0 20px 24px;padding:26px 22px;background:#191919;border:1px solid #393939;border-radius:15px}
    .dss-cart-summary h2{font-size:26px;margin:0 0 28px}
    .dss-summary-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;color:#ccc;font-size:17px}
    .dss-summary-row b{color:#f5f5f5;font-size:18px}

    .dss-discount-row b{color:#18c765}
    .dss-summary-total{border-top:1px solid #383838;margin-top:12px;padding-top:24px;font-size:22px;font-weight:bold;color:white}

    .dss-continue-button{background:transparent;color:#fff;border:1px solid #414141}
    #orderForm{display:none;margin:0 20px 28px;padding:20px;border:1px solid #393939;border-radius:14px;background:#191919}
    #orderForm.dss-order-visible{display:grid}
    .dss-empty-cart{padding:24px 0;color:#ccc}

  <script>
    /* Kategorite levizin automatikisht nga e majta ne te djathte; ndalen perkohesisht kur perdoruesi prek rreshtin. */
    (function () {
      const initCategoryMotion = () => {
        const rail = document.querySelector("#categories");
        if (!rail || rail.dataset.autoMotionReady === "1" || rail.children.length < 2) return;
        rail.dataset.autoMotionReady = "1";
        rail.style.direction = "ltr";
        let pauseUntil = 0;
        let lastTime = 0;
        const speed = 24; // pikselë në sekondë
        const pause = () => { pauseUntil = Date.now() + 3500; };
        rail.addEventListener("touchstart", pause, { passive: true });
        rail.addEventListener("pointerdown", pause);
        rail.addEventListener("mouseenter", pause);
        rail.addEventListener("focusin", pause);
        const animate = (time) => {
          if (!document.hidden && Date.now() > pauseUntil) {
            const max = rail.scrollWidth - rail.clientWidth;
            if (max > 1) {
              if (lastTime) rail.scrollLeft -= speed * Math.min((time - lastTime) / 1000, 0.05);
              if (rail.scrollLeft <= 0) rail.scrollLeft = max;
            }
          }
          lastTime = time;
          requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
      };
      const rail = document.querySelector("#categories");
      if (rail) {
        const observer = new MutationObserver(initCategoryMotion);
        observer.observe(rail, { childList: true });
        initCategoryMotion();
      }
      window.addEventListener("load", initCategoryMotion);
    })();
  </script>
